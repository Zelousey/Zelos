name: CI

# Fast checks on every pull request and every push to main. No secrets, no deploys:
# it only reads the code. Make "checks" a required status check in the main-branch
# ruleset so nothing merges while it is red.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same as the Cloud Functions runtime (firebase.json)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax (functions + scripts)
        run: python -m py_compile functions/*.py scripts/*.py scripts/page-src/*.py scripts/page-src/learn/*.py

      - name: Unit tests
        run: |
          set -e
          for t in scripts/*_test.py; do
            echo "::group::$t"
            python -I "$t"
            echo "::endgroup::"
          done

      - name: JavaScript syntax
        run: |
          set -e
          find . -name '*.js' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: JSON files parse
        run: |
          set -e
          find . -name '*.json' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 python -c 'import json,sys; json.load(open(sys.argv[1]))'

      - name: No secret files committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env\.local|\.secret\.local|.*service-?account.*\.json|.*-firebase-adminsdk-.*\.json)$' || true)
          if [ -n "$bad" ]; then echo "Secret-looking files are committed:"; echo "$bad"; exit 1; fi

  rules:
    # Firestore + Realtime Database security rules, tested on the Firebase emulators
    # (a fake "demo-" project: nothing real is touched, no credentials needed).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - run: npm ci

      - name: Rules tests
        run: npm test

  functions-e2e:
    # xp_award and account_delete end to end: real Python functions on the
    # Auth + Firestore + Functions emulators (fake "demo-" project, no credentials).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Functions virtualenv
        run: |
          python -m venv functions/venv
          functions/venv/bin/pip install -r functions/requirements.txt

      - run: npm ci
        working-directory: tests/rules

      - name: Functions end-to-end
        run: npm run test:functions
        working-directory: tests/rules

  webapp:
    # The app (webapp/): lint, typecheck, unit tests, production build, then browser
    # smoke tests (phone + desktop, accessibility) against that build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Browser
        run: npx playwright install --with-deps chromium

      # the browser tests run against the Auth + Firestore emulators (fake demo project),
      # seeded with real-shaped market data; the emulators need Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Browser tests (phone + desktop, accessibility, market flow)
        run: npm run test:e2e
