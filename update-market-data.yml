name: Update market data

# Refreshes data/market-snapshot.json (the site's ticker tape, Market Overview
# chart and sector tables) after every US market close. Runs on GitHub's
# servers: no Claude usage, no API keys, free for public repos.
on:
  schedule:
    # 21:20 UTC Mon–Fri = 5:20 pm EDT / 4:20 pm EST, always after the close.
    # (GitHub's scheduler can run a few minutes late; that's fine.)
    - cron: '20 21 * * 1-5'
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices and rebuild snapshot
        run: python3 scripts/update_market_snapshot.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/market-snapshot.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "zelos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-snapshot.json
          git commit -m "Market data: $(date -u +%Y-%m-%d) close"
          git push
