<!doctype html>
<!-- Notification picture template (owner-approved 2026-10-27, the #120 share-picture look), 1024x512.
     Change the kicker, title and subtitle, open next to logo-master.png and screenshot at 1024x512
     (scripts: see the comment in docs/brand/share-image.html). Files: images/alert-<id>.png. --><html><head><meta charset="utf-8"><style>
html,body{margin:0}body{width:1024px;height:512px;overflow:hidden;font-family:'DejaVu Sans',Arial,sans-serif;color:#f4f5f7;
background:radial-gradient(ellipse at 18% 50%,rgba(37,99,235,.35),transparent 55%),radial-gradient(ellipse at 95% 60%,rgba(211,32,20,.28),transparent 50%),#0b0d12;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:52px;padding:0 64px}
img{width:330px;height:330px;border-radius:72px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.k{font-size:24px;font-weight:700;letter-spacing:.38em;color:#4a86ff}
h1{margin:12px 0 0;font-size:66px;font-weight:900;line-height:1.05}
.line{width:110px;height:6px;margin:26px 0 22px;background:linear-gradient(90deg,#3b82f6,#ef4444)}
p{margin:0;font-size:27px;line-height:1.35;color:#c9ced8;max-width:500px}
.url{position:absolute;right:64px;bottom:34px;font-size:19px;letter-spacing:.08em;color:#8b93a3}
</style></head><body><div class="grid"></div><div class="wrap"><img src="logo-master.png"><div>
<div class="k">NEW ALERT</div><h1>Zelos Alerts</h1><div class="line"></div><p>Rule-based scans, every market day</p></div></div>
<div class="url">agentictrading.info · not financial advice</div></body></html>
