<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b0d12;color:#e8eaf0;font-family:'DejaVu Sans',Arial,sans-serif;padding:40px;width:1520px}
h1{font-size:30px;margin:0 0 6px} p.sub{color:#9aa3b2;margin:0 0 28px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.c{background:#151922;border:1px solid #262c38;border-radius:16px;padding:22px}
.c h2{margin:0 0 4px;font-size:22px}.c .d{color:#9aa3b2;font-size:14px;margin:0 0 16px;min-height:38px}
.row{display:flex;align-items:center;gap:22px}
.ic{width:150px;height:150px}.sm{width:44px;height:44px}
.wm{display:flex;align-items:center;gap:10px;margin-top:18px;font-weight:900;font-size:30px;letter-spacing:.04em}
.wm svg{width:40px;height:40px}.wm small{font-weight:600;font-size:13px;letter-spacing:.2em;color:#9aa3b2;display:block}
.light{background:#f4f5f8;border-radius:10px;padding:8px 12px;color:#0b0d12;margin-top:12px;display:inline-flex}
</style></head><body>
<h1>Zelos logo directions</h1>
<p class="sub">Six directions, each shown as an app icon, a small icon and a word logo. Pick one (or mix parts) and I'll refine it.</p>
<div class="grid" id="g"></div>
<script>
const L={
1:{n:'1 · Z-Arrow',d:'A bold Z whose middle stroke is a rising chart arrow. Simple, reads at any size.',bg:'#1d4ed8',s:`<path d="M28 30h52L36 74h44" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square"/><path d="M58 30h22v22" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="square"/>`},
2:{n:'2 · Candle Z',d:'Three candlesticks stepping up, drawn so they form a Z. Says "trading" at a glance.',bg:'#0f172a',s:`<g stroke-width="3"><line x1="30" y1="62" x2="30" y2="86" stroke="#ef4444"/><rect x="24" y="68" width="12" height="14" fill="#ef4444"/><line x1="52" y1="38" x2="52" y2="74" stroke="#22c55e"/><rect x="46" y="44" width="12" height="24" fill="#22c55e"/><line x1="74" y1="16" x2="74" y2="50" stroke="#22c55e"/><rect x="68" y="22" width="12" height="22" fill="#22c55e"/></g><path d="M22 24h30M52 84h34" stroke="#e2e8f0" stroke-width="6"/>`},
3:{n:'3 · Trade War shield',d:'A shield with two crossed swords (bull blue, bear red) and an up-arrow. Ties to Battles.',bg:'#111827',s:`<path d="M52 12l32 10v26c0 22-14 36-32 44C34 84 20 70 20 48V22z" fill="#1f2937" stroke="#e5e7eb" stroke-width="4"/><path d="M32 72L70 30M72 72L34 30" stroke-width="6" stroke-linecap="square"/><path d="M32 72L70 30" stroke="#3b82f6" stroke-width="6"/><path d="M72 72L34 30" stroke="#ef4444" stroke-width="6"/><path d="M44 30h-12v12M60 30h12v12" fill="none" stroke="#e5e7eb" stroke-width="4"/>`},
4:{n:'4 · Square monogram',d:'A sharp square with a Z cut out and a chart line through it. Goes with the square UI.',bg:'#0b0d12',square:1,s:`<rect x="14" y="14" width="76" height="76" fill="#2563eb"/><path d="M30 32h44L32 72h44" fill="none" stroke="#0b0d12" stroke-width="11" stroke-linecap="square"/><path d="M14 64l18-8 14 6 18-18 26-10" fill="none" stroke="#bfdbfe" stroke-width="3"/>`},
5:{n:'5 · Laurel Z',d:'A Z inside a Greek laurel, red and black like the Hall of Minds. Zelos is the Greek spirit of zeal.',bg:'#b3170f',s:`<g fill="none" stroke="#fde68a" stroke-width="3">${[0,1,2,3,4].map(i=>`<ellipse cx="${26+i*2}" cy="${74-i*11}" rx="4" ry="8" transform="rotate(${-40+i*10} ${26+i*2} ${74-i*11})"/><ellipse cx="${78-i*2}" cy="${74-i*11}" rx="4" ry="8" transform="rotate(${40-i*10} ${78-i*2} ${74-i*11})"/>`).join('')}</g><path d="M38 34h28L38 70h28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="square"/>`},
6:{n:'6 · Target O',d:'A word logo first: ZELOS with the O as a target and an arrow hitting it. Icon is the target.',bg:'#0f172a',s:`<circle cx="52" cy="52" r="30" fill="none" stroke="#e2e8f0" stroke-width="7"/><circle cx="52" cy="52" r="14" fill="none" stroke="#38bdf8" stroke-width="7"/><circle cx="52" cy="52" r="4" fill="#38bdf8"/><path d="M84 20L56 48" stroke="#22c55e" stroke-width="6"/><path d="M84 20h-14M84 20v14" stroke="#22c55e" stroke-width="6" fill="none"/>`},
};
const g=document.getElementById('g');
for(const k in L){const o=L[k];const r=o.square?0:22;
const icon=(cls)=>`<svg class="${cls}" viewBox="0 0 104 104"><rect width="104" height="104" rx="${r}" fill="${o.bg}"/>${o.s}</svg>`;
const word=k==6?`<span>ZEL<svg viewBox="0 0 104 104" style="width:30px;height:30px;vertical-align:-4px">${o.s}</svg>S</span>`:`${icon('')}<span>ZELOS<small>TRADE WAR</small></span>`;
g.insertAdjacentHTML('beforeend',`<div class="c"><h2>${o.n}</h2><p class="d">${o.d}</p><div class="row">${icon('ic')}${icon('sm')}</div><div class="wm">${word}</div><div class="light wm" style="margin-top:10px;font-size:22px">${word}</div></div>`)}
</script></body></html>
